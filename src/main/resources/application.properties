# ====================================================================
# CONFIGURACIÓN PRINCIPAL SILBOM BACKEND - SPRING BOOT 3.3.x
# Aplicación de Controles de Ciberseguridad y Parámetros Operativos
# ====================================================================

spring.application.name=silbom-backend

# Carga automáticamente el archivo ".env" de la carpeta del proyecto (si existe).
# Así DB_USERNAME, DB_PASSWORD, APP_API_KEY, etc. funcionan sin configurarlas a mano.
spring.config.import=optional:file:.env[.properties]

# --------------------------------------------------------------------
# CONTROL 1: Ocultar credenciales con variables de entorno y defaults
# --------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/silbom_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración del Pool HikariCP para resiliencia de conexiones
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# --------------------------------------------------------------------
# Hibernate / JPA
# --------------------------------------------------------------------
# 'update' ajusta automáticamente las tablas según las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# --------------------------------------------------------------------
# CONTROL 9: Proteger Session Cookies
# --------------------------------------------------------------------
server.port=${SERVER_PORT:8080}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=strict

# --------------------------------------------------------------------
# CONTROL 16: Restringir subida de archivos (Evitar payloads binarios)
# --------------------------------------------------------------------
spring.servlet.multipart.enabled=false

# --------------------------------------------------------------------
# CONTROL 17: Ocultar trazas de error internas del servidor
# --------------------------------------------------------------------
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# --------------------------------------------------------------------
# CONTROLES 4, 5 y 6: Parámetros del Dominio de Seguridad SILBOM
# --------------------------------------------------------------------
# API Key requerida en cabecera 'X-API-KEY' para POST/PUT/DELETE
silbom.security.api-key=${APP_API_KEY}

# Clave AES-256 (32 bytes aleatorios en Base64) para cifrar notas confidenciales (Control 5). Sin valor por defecto.
silbom.security.encryption-secret=${ENCRYPTION_SECRET}

# Identificador de planta física para control de acceso y RLS (Control 4 y 7)
silbom.security.planta-id=${PLANTA_ID:PLANTA-SAN-JOAQUIN}
